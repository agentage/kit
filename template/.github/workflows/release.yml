name: Release

# A merge is the release: agentage extension release --changed gives this extension, when its files
# differ from its last <id>@* tag, a date version YYYY.MDD.N, the tag <id>@<version>, its images, the
# records on the GitHub release and npm with OIDC (a private package skips npm). It refuses the id of
# the starting point, so only a repo made by agentage extension create releases.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Images, record, package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts && npm run verify
      - run: npm install -g npm@11 # OIDC needs npm >= 11.5.1
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y @agentage/cli@0.76.0 extension release --changed # pinned: the merge-release cli
