name: CI

on:
  push:
    branches: [master]
  pull_request:
    # feature/**: a stacked PR (base = another PR's branch) gets CI too.
    branches: [master, 'feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prTitle:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title is a conventional commit with a scope from CLAUDE.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          scoped='^(feat|fix|refactor|test|chore|ci|docs|perf|build)\((extension|logs|widget|identity|shell|release|ci|docs|deps)\)!?: .{1,60}$'
          bare='^(ci|docs|chore|build): '
          if [ "${#TITLE}" -le 72 ] && { [[ $TITLE =~ $scoped ]] || [[ $TITLE =~ $bare ]]; }; then exit 0; fi
          echo "::error::PR title '$TITLE' breaks the commit title rules in CLAUDE.md (type(scope): text, max 72)"; exit 1

  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Each CI job stays well under 8 minutes (the Docker smokes run in the Image smokes job); slower is a regression.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: A version bump needs a change in that package
        if: github.event_name == 'pull_request'
        run: node scripts/check-bumps.mjs origin/${{ github.base_ref }}

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Pack smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack -w @agentage/extension --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-extension-*.tgz > /tmp/pack/files.txt
          grep -qx 'package/dist/tool/cli.js' /tmp/pack/files.txt
          grep -qx 'package/dist/runtime/main.js' /tmp/pack/files.txt
          grep -qx 'package/schemas/extension-discovery.schema.json' /tmp/pack/files.txt
          grep -qx 'package/dist/store/migrate.js' /tmp/pack/files.txt
          grep -qx 'package/dist/tool/up/dev-issuer.js' /tmp/pack/files.txt
          grep -qx 'package/dist/logs/index.js' /tmp/pack/files.txt
          grep -qx 'package/dist/vendor/logs/index.js' /tmp/pack/files.txt
          if grep -q '\.test\.' /tmp/pack/files.txt; then echo 'test files in the tarball'; exit 1; fi
          node packages/extension/dist/tool/cli.js --help
          # The kit carries @agentage/logs inside: a clean install of the tarball alone resolves both entries.
          mkdir -p /tmp/kit-alone && cd /tmp/kit-alone && npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/pack/agentage-extension-*.tgz express zod
          test ! -e node_modules/@agentage/logs
          node --input-type=module -e "await import('@agentage/extension'); const l = await import('@agentage/extension/logs'); const e = l.parseLine('hello', { extension: 'smoke', part: 'ci' }); l.EventSchema.parse(e); console.log('PASS kit alone', e.kind, l.KINDS.length)"

      - name: Pack smoke - widget (bin and harness in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/widget --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-widget-*.tgz > /tmp/pack/widget-files.txt
          grep -qx 'package/dist/bundle/cli.js' /tmp/pack/widget-files.txt
          grep -qx 'package/dist/ds/styles.generated.js' /tmp/pack/widget-files.txt
          grep -qx 'package/harness/harness.html' /tmp/pack/widget-files.txt
          if grep -Eq '\.test\.|test-support|/e2e/' /tmp/pack/widget-files.txt; then echo 'test files in the widget tarball'; exit 1; fi
          node packages/widget/dist/bundle/cli.js --help

      - name: Pack smoke - logs (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/logs --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-logs-*.tgz > /tmp/pack/logs-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/logs-files.txt
          if grep -Eq '\.test\.' /tmp/pack/logs-files.txt; then echo 'test files in the logs tarball'; exit 1; fi

      - name: Pack smoke - identity (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/identity --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-identity-*.tgz > /tmp/pack/identity-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/identity-files.txt
          if grep -Eq '\.test\.' /tmp/pack/identity-files.txt; then echo 'test files in the identity tarball'; exit 1; fi

      - name: Pack smoke - shell (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/shell --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-shell-*.tgz > /tmp/pack/shell-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/shell-files.txt
          grep -qx 'package/dist/mount-widgets.js' /tmp/pack/shell-files.txt
          if grep -Eq '\.test\.|test-support' /tmp/pack/shell-files.txt; then echo 'test files in the shell tarball'; exit 1; fi

  smokes:
    name: Image smokes
    runs-on: ubuntu-latest
    # The Docker smokes alone, in parallel with Verify; they pack and build the kit themselves.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Image smoke - extension-probe on this kit, every part through up
        env:
          PROBE_REF: ${{ vars.PROBE_REF }}
        run: |
          set -euo pipefail
          npm pack --workspaces --pack-destination /tmp/pack >/dev/null
          # A PR runs against the extension-probe branch named as its head (or a non-default base), else
          # the repo variable PROBE_REF (set while a kit change waits on a probe release), else master.
          probe=https://github.com/agentage/extension-probe.git
          branch="${PROBE_REF:-master}"
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$probe" "$ref" >/dev/null; then branch="$ref"; fi
          done
          echo "extension-probe branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch "$branch" "$probe" /tmp/probe
          mkdir -p /tmp/probe/.kit
          cd /tmp/probe
          # The probe's @agentage/* dependencies built here replace the registry copies.
          tarballs=()
          for tgz in /tmp/pack/agentage-*.tgz; do
            name="@agentage/$(basename "$tgz" | sed -E 's/^agentage-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            if jq -e --arg n "$name" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' package.json >/dev/null; then
              cp "$tgz" .kit/ && tarballs+=("./.kit/$(basename "$tgz")")
            fi
          done
          npm install --no-audit --no-fund "${tarballs[@]}"
          # The smoke proves the runtime, not probe's pin: a kit minor bump must not wait on a probe release.
          pin="^$(jq -r .version node_modules/@agentage/extension/package.json | cut -d. -f1,2)"
          was=$(jq -r .engines.agentage package.json)
          if [ "$was" != "$pin" ]; then echo "::warning::probe pin stale: engines.agentage $was, smoke runs it as $pin"; fi
          jq --arg r "$pin" '.engines.agentage = $r' package.json > /tmp/pkg.json && cp /tmp/pkg.json package.json
          node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: Image smoke - discovery is valid through the gateway, e2e (up already asserted each part's /health commit)
        working-directory: /tmp/probe
        run: |
          set -euo pipefail
          curl -sf http://localhost:4280/.well-known/agentage-extension.json > /tmp/discovery.json
          node --input-type=module -e "import { DiscoveryDocumentSchema } from '@agentage/extension/contracts'; import { readFileSync } from 'node:fs'; DiscoveryDocumentSchema.parse(JSON.parse(readFileSync('/tmp/discovery.json', 'utf8'))); console.log('PASS discovery valid')"
          npx playwright install chromium
          npm run test:e2e

      # The one container (C7): the image builds from this kit, starts healthy and serves the api.
      - name: One container smoke - build --container, run it, the api answers
        working-directory: /tmp/probe
        run: |
          set -euo pipefail
          node node_modules/@agentage/extension/dist/tool/cli.js build --container
          image="ghcr.io/agentage/$(jq -r .agentage.id package.json):$(jq -r .version package.json)"
          docker run -d --name one -p 127.0.0.1:18080:8080 -e AGENTAGE_HOST_AUTH=off "$image"
          trap 'docker logs one 2>&1 | tail -40' ERR
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' one)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' one | grep -qx healthy
          curl -sf "http://127.0.0.1:18080/api/probe/echo?msg=hi" | grep -q '"msg":"hi"'
          echo "PASS one container $image"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f /tmp/probe/.agentage/compose.json logs --no-color --tail 80 || true

  widget-screenshots:
    name: Widget screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Harness, echo widget and light and dark screenshots (Chromium)
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widget-playwright-report
          path: |
            packages/widget/playwright-report
            packages/widget/test-results
          retention-days: 7

  probe-local-gate:
    name: Probe local gate on this kit
    needs: verify
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: platform

      # The same probe branch as the image smoke: head, a non-default base, vars.PROBE_REF, master.
      - name: Pick the extension-probe branch
        id: probe-ref
        env:
          PROBE_REF: ${{ vars.PROBE_REF }}
        run: |
          branch="${PROBE_REF:-master}"
          probe=https://github.com/agentage/extension-probe.git
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$probe" "$ref" >/dev/null; then branch="$ref"; fi
          done
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The same rule for agentage/e2e: head, a non-default base, vars.E2E_REF, master.
      - name: Pick the agentage/e2e branch
        id: e2e-ref
        if: github.actor != 'dependabot[bot]'
        env:
          E2E_REF: ${{ vars.E2E_REF }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          branch="${E2E_REF:-master}"
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && gh api "repos/agentage/e2e/branches/$ref" --silent 2>/dev/null; then branch="$ref"; fi
          done
          echo "e2e branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout agentage/extension-probe
        uses: actions/checkout@v7
        with:
          repository: agentage/extension-probe
          ref: ${{ steps.probe-ref.outputs.branch }}
          path: probe

      # agentage/e2e is private; the org PAT_TOKEN reads it. Dependabot runs get no secrets.
      - name: Checkout agentage/e2e
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          ref: ${{ steps.e2e-ref.outputs.branch }}
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      # The tarballs sit in the probe folder and the lock points at them, so the server images build from the candidate.
      - name: Pack the candidate kit and widget, install them in probe
        run: |
          npm ci --prefix platform
          npm run build --prefix platform
          npm pack --workspaces --prefix platform --pack-destination "$PWD/probe"
          cd probe
          # No npm ci first: a probe that already pins the candidate version cannot fetch it from npm.
          npm install --no-audit --no-fund ./agentage-extension-*.tgz ./agentage-widget-*.tgz
          # Permanent: the probe's own range refuses every new kit minor; the gate proves the candidate runs the probe.
          npm pkg set engines.agentage=">=0.6"
          grep -E "\"@agentage/(extension|widget)\": \"file:" package.json
          grep -cE "\"resolved\": \"file:agentage-(extension|widget)-" package-lock.json
          npm run build

      - name: agentage extension up
        working-directory: probe
        # The kit's own tool, not the agentage bin: the probe's @agentage/cli bundles the released kit.
        run: node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: e2e gate on local (agentage/e2e, probe gate local)
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          PROBE_DIR: ${{ github.workspace }}/probe
        run: |
          npm ci
          # The gate validates the discovery document and the record with the kit under test.
          npm install --no-save ../probe/agentage-extension-*.tgz
          # The version alone cannot tell the candidate from npm (both can be 0.13.0): the source can.
          resolved=$(jq -r '.packages["node_modules/@agentage/extension"].resolved' node_modules/.package-lock.json)
          echo "e2e validates with @agentage/extension $(jq -r .version node_modules/@agentage/extension/package.json) from $resolved"
          case "$resolved" in file:*) ;; *) echo "::error::the e2e kit is $resolved, not the candidate"; exit 1 ;; esac
          npx playwright install chromium
          npm run e2e -- probe gate local

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '30'
        run: node scripts/assert-executed.mjs

      - name: agentage extension down
        if: always()
        working-directory: probe
        run: node node_modules/@agentage/extension/dist/tool/cli.js down || true
